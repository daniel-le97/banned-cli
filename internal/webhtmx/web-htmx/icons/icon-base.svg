<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#4fc3f7" stroke="#2196f3" stroke-width="8"/>
  
  <!-- Database icon -->
  <g transform="translate(256, 256)">
    <!-- Top ellipse -->
    <ellipse cx="0" cy="-80" rx="120" ry="30" fill="#ffffff" opacity="0.9"/>
    
    <!-- Middle cylinder -->
    <rect x="-120" y="-80" width="240" height="120" fill="#ffffff" opacity="0.8"/>
    
    <!-- Side highlights -->
    <ellipse cx="-90" cy="-20" rx="15" ry="60" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="90" cy="-20" rx="15" ry="60" fill="#ffffff" opacity="0.3"/>
    
    <!-- Bottom ellipse -->
    <ellipse cx="0" cy="40" rx="120" ry="30" fill="#ffffff" opacity="0.9"/>
    
    <!-- Data lines -->
    <g opacity="0.6">
      <rect x="-80" y="-60" width="160" height="4" rx="2" fill="#4fc3f7"/>
      <rect x="-80" y="-45" width="120" height="4" rx="2" fill="#4fc3f7"/>
      <rect x="-80" y="-30" width="140" height="4" rx="2" fill="#4fc3f7"/>
      <rect x="-80" y="-15" width="100" height="4" rx="2" fill="#4fc3f7"/>
      <rect x="-80" y="0" width="130" height="4" rx="2" fill="#4fc3f7"/>
      <rect x="-80" y="15" width="110" height="4" rx="2" fill="#4fc3f7"/>
    </g>
  </g>
  
  <!-- Brand text -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff">DB</text>
  <text x="256" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" opacity="0.8">Editor</text>
</svg>